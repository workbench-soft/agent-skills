# The newer mise picks a package manager that leaves out oxfmt's own
# dependencies on the Windows runner, so oxfmt fails to find tinypool.
[settings]
npm.package_manager = "npm"

[tools]
node = "24.22.2"
"npm:oxfmt" = "0.75.0"
"npm:oxlint" = "1.90.0"
python = "3.15"
ruff = "0.17.3"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "Lint and format check the scripts, the skills and the docs"
run = [
  "shellcheck .github/scripts/next-version.sh .github/scripts/release-notes.sh install.sh scripts/install-in-temp-home.sh",
  "shfmt -i 2 -ci -d .github/scripts/next-version.sh .github/scripts/release-notes.sh install.sh scripts/install-in-temp-home.sh",
  "ruff check",
  "ruff format --check",
  "oxlint --deny-warnings",
  "oxfmt --check",
  "node scripts/keyword-check.mts AGENTS.md writing-style.instructions.md skills/*/SKILL.md skills/*/references/*.md .agents/skills/*/SKILL.md",
]

[tasks.test]
description = "Check the skills, run the unit tests, install and uninstall in a temp home"
run = [
  "python scripts/check-skills.py",
  "python scripts/check-prose-budget.py",
  "python -m unittest discover -s tests",
  "node --test tests/*.test.ts",
  "sh scripts/install-in-temp-home.sh",
]

[tasks.format]
description = "Format the scripts, the skills and the docs"
run = [
  "shfmt -i 2 -ci -w .github/scripts/next-version.sh .github/scripts/release-notes.sh install.sh scripts/install-in-temp-home.sh",
  "ruff format",
  "oxfmt",
]
