name: affected-probe
on:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: workbench-soft/ci/actions/affected@main
        id: affected
        with:
          since: release
      - run: echo "run=${{ steps.affected.outputs.run }}"
