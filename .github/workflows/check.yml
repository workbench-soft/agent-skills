name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR from a fork gets a read-only token.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  # The PowerShell step needs Windows.
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml pins the tools.
      - name: Install the pinned tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Lint and format check every language
        run: mise run lint

      # A broken frontmatter or link drops a skill, or a file of it, from the
      # agent with no error. A skill that breaks a writing rule teaches it.
      # The task also runs the prose budget, the unit tests and the install
      # in a clean home.
      - name: Skills, unit tests and the install
        run: mise run test

      # install.ps1 runs install.sh, so this checks the flags get through.
      - name: Install and uninstall from PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # A copy with no .git, so no relink hook lands in this checkout and
          # fires on the next run with the real HOME.
          $src = Join-Path $env:RUNNER_TEMP "ps-src"
          $env:HOME = Join-Path $env:RUNNER_TEMP "ps-home"
          New-Item -ItemType Directory -Force $src, "$env:HOME\.claude" | Out-Null
          git archive -o "$env:RUNNER_TEMP\src.tar" HEAD
          # Git's bin comes first on the runner PATH, and its tar reads C: as a host.
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\src.tar" -C $src
          if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          & "$src\install.ps1" -Lang Spanish
          if (-not (Test-Path "$env:HOME\.claude\skills\review\SKILL.md")) { throw "review not linked" }
          if ((Get-Content "$src\skills\review\LANGUAGE.md") -ne "Spanish") { throw "-Lang not passed" }
          if (-not (Test-Path "$env:HOME\.claude\hooks\turn-voice.exe")) { throw "turn-voice not built" }
          if (-not (Select-String -Quiet "turn-voice.exe" "$env:HOME\.claude\settings.json")) { throw "turn-voice hooks missing" }
          & "$src\install.ps1" -Uninstall -Yes
          if (Test-Path "$env:HOME\.claude\skills\review") { throw "review not removed" }
          if (Test-Path "$env:HOME\.claude\hooks\turn-voice.exe") { throw "turn-voice not removed" }
          if (Select-String -Quiet "turn-voice.exe" "$env:HOME\.claude\settings.json") { throw "turn-voice hooks left" }

  # macOS and Linux run install.sh with their own sh, such as dash, where
  # the Windows job runs Git Bash.
  install-posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and uninstall in a clean home
        run: sh scripts/install-in-temp-home.sh
